  </head>
  <body>
    <style>
      html, body { margin: 0; height: 100%; background: #070b14; color: #d6e4f5; overflow: hidden; font-family: system-ui, sans-serif;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      /* Sin selección, zoom por doble toque ni gestos del navegador sobre el juego. */
      html[data-input='touch'] body, html[data-input='touch'] #app { -webkit-user-select: none; user-select: none; touch-action: none; }
      #app { position: fixed; inset: 0; height: 100dvh; }
      #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #070b14; z-index: 50; letter-spacing: .3em; font-size: 13px; text-transform: uppercase; color: #5fe0b7; }
      .boot-error { max-width: 480px; padding: 24px; text-align: center; letter-spacing: normal; text-transform: none; color: #d6e4f5; }
      .boot-error h1 { color: #ff4d4d; font-size: 20px; }
    </style>
    <div id="app"></div>
    <div id="boot" role="status">Generando distrito…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
